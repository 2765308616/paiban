<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自定义轮班日历</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        day: '#3B82F6',
                        night: '#8B5CF6',
                        rest: '#10B981',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-6xl">
        <!-- 标题 -->
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-8">
            <i class="fa fa-calendar-check-o text-blue-500 mr-2"></i>自定义轮班日历
        </h1>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- 配置面板 -->
            <div class="lg:col-span-1 bg-white rounded-xl shadow-lg p-6">
                <h2 class="text-xl font-semibold text-gray-700 mb-6 flex items-center">
                    <i class="fa fa-cog text-gray-500 mr-2"></i>轮班配置
                </h2>

                <!-- 周期开始日期 -->
                <div class="mb-5">
                    <label class="block text-sm font-medium text-gray-600 mb-2">周期开始日期</label>
                    <input type="date" id="startDate" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>

                <!-- 周期总天数 -->
                <div class="mb-5">
                    <label class="block text-sm font-medium text-gray-600 mb-2">周期总天数</label>
                    <input type="number" id="cycleDays" min="1" max="31" value="8" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>

                <!-- 班次配置区域 -->
                <div class="mb-5">
                    <label class="block text-sm font-medium text-gray-600 mb-3">班次配置（按周期顺序）</label>
                    <div id="shiftConfig" class="space-y-3">
                        <!-- 动态生成班次配置项 -->
                    </div>
                </div>

                <!-- 操作按钮 -->
                <div class="flex gap-3">
                    <button onclick="generateCalendar()" class="flex-1 bg-blue-500 hover:bg-blue-600 text-white font-medium py-2 px-4 rounded-lg transition-colors">
                        <i class="fa fa-refresh mr-1"></i>生成日历
                    </button>
                    <button onclick="resetConfig()" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-lg transition-colors">
                        <i class="fa fa-undo"></i>
                    </button>
                </div>

                <!-- 图例 -->
                <div class="mt-8 pt-6 border-t border-gray-200">
                    <h3 class="text-sm font-medium text-gray-600 mb-3">图例说明</h3>
                    <div class="space-y-2" id="legend">
                        <!-- 动态生成图例 -->
                    </div>
                </div>
            </div>

            <!-- 日历面板 -->
            <div class="lg:col-span-2 bg-white rounded-xl shadow-lg p-6">
                <!-- 月份导航 -->
                <div class="flex justify-between items-center mb-6">
                    <button onclick="prevMonth()" class="p-2 hover:bg-gray-100 rounded-lg transition-colors">
                        <i class="fa fa-chevron-left text-gray-600"></i>
                    </button>
                    <h2 id="currentMonth" class="text-xl font-semibold text-gray-700"></h2>
                    <button onclick="nextMonth()" class="p-2 hover:bg-gray-100 rounded-lg transition-colors">
                        <i class="fa fa-chevron-right text-gray-600"></i>
                    </button>
                </div>

                <!-- 星期标题 -->
                <div class="grid grid-cols-7 gap-1 mb-2">
                    <div class="text-center text-sm font-medium text-gray-500 py-2">日</div>
                    <div class="text-center text-sm font-medium text-gray-500 py-2">一</div>
                    <div class="text-center text-sm font-medium text-gray-500 py-2">二</div>
                    <div class="text-center text-sm font-medium text-gray-500 py-2">三</div>
                    <div class="text-center text-sm font-medium text-gray-500 py-2">四</div>
                    <div class="text-center text-sm font-medium text-gray-500 py-2">五</div>
                    <div class="text-center text-sm font-medium text-gray-500 py-2">六</div>
                </div>

                <!-- 日历网格 -->
                <div id="calendarGrid" class="grid grid-cols-7 gap-1">
                    <!-- 动态生成日历 -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // 默认配置
        let currentDate = new Date();
        let shifts = [
            { name: '白班', color: '#3B82F6' },
            { name: '白班', color: '#3B82F6' },
            { name: '白班', color: '#3B82F6' },
            { name: '白班', color: '#3B82F6' },
            { name: '夜班', color: '#8B5CF6' },
            { name: '休息', color: '#10B981' },
            { name: '休息', color: '#10B981' },
            { name: '休息', color: '#10B981' }
        ];
        let cycleStartDate = new Date();

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            // 设置默认开始日期为今天
            document.getElementById('startDate').valueAsDate = new Date();
            cycleStartDate = new Date();
            
            // 初始化班次配置
            initShiftConfig();
            
            // 生成日历
            generateCalendar();
        });

        // 监听周期天数变化
        document.getElementById('cycleDays').addEventListener('change', (e) => {
            const days = parseInt(e.target.value) || 8;
            // 调整shifts数组长度
            if (shifts.length < days) {
                while (shifts.length < days) {
                    shifts.push({ name: '休息', color: '#10B981' });
                }
            } else if (shifts.length > days) {
                shifts = shifts.slice(0, days);
            }
            initShiftConfig();
        });

        // 初始化班次配置界面
        function initShiftConfig() {
            const container = document.getElementById('shiftConfig');
            container.innerHTML = '';
            
            shifts.forEach((shift, index) => {
                const div = document.createElement('div');
                div.className = 'flex items-center gap-2';
                div.innerHTML = `
                    <span class="text-sm text-gray-500 w-8">第${index + 1}天</span>
                    <input type="text" value="${shift.name}" 
                           onchange="updateShiftName(${index}, this.value)"
                           class="flex-1 px-2 py-1 text-sm border border-gray-300 rounded focus:ring-1 focus:ring-blue-500">
                    <input type="color" value="${shift.color}" 
                           onchange="updateShiftColor(${index}, this.value)"
                           class="w-10 h-8 rounded cursor-pointer border-0">
                `;
                container.appendChild(div);
            });
            
            updateLegend();
        }

        function updateShiftName(index, name) {
            shifts[index].name = name;
            updateLegend();
        }

        function updateShiftColor(index, color) {
            shifts[index].color = color;
            updateLegend();
        }

        function updateLegend() {
            const legend = document.getElementById('legend');
            const uniqueShifts = [...new Map(shifts.map(s => [s.name, s])).values()];
            
            legend.innerHTML = uniqueShifts.map(shift => `
                <div class="flex items-center gap-2">
                    <div class="w-4 h-4 rounded" style="background-color: ${shift.color}"></div>
                    <span class="text-sm text-gray-600">${shift.name}</span>
                </div>
            `).join('');
        }

        function resetConfig() {
            shifts = [
                { name: '白班', color: '#3B82F6' },
                { name: '白班', color: '#3B82F6' },
                { name: '白班', color: '#3B82F6' },
                { name: '白班', color: '#3B82F6' },
                { name: '夜班', color: '#8B5CF6' },
                { name: '休息', color: '#10B981' },
                { name: '休息', color: '#10B981' },
                { name: '休息', color: '#10B981' }
            ];
            document.getElementById('cycleDays').value = 8;
            document.getElementById('startDate').valueAsDate = new Date();
            cycleStartDate = new Date();
            initShiftConfig();
            generateCalendar();
        }

        // 生成日历
        function generateCalendar() {
            // 更新开始日期
            cycleStartDate = document.getElementById('startDate').valueAsDate || new Date();
            
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            // 更新月份标题
            document.getElementById('currentMonth').textContent = `${year}年${month + 1}月`;
            
            // 获取当月第一天和最后一天
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const startDayOfWeek = firstDay.getDay();
            const daysInMonth = lastDay.getDate();
            
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';
            
            // 填充上月空白
            for (let i = 0; i < startDayOfWeek; i++) {
                const empty = document.createElement('div');
                empty.className = 'h-20 bg-gray-50 rounded';
                grid.appendChild(empty);
            }
            
            // 填充当月日期
            for (let day = 1; day <= daysInMonth; day++) {
                const date = new Date(year, month, day);
                const dayElement = document.createElement('div');
                
                // 计算与周期开始日的天数差
                const diffTime = date - cycleStartDate;
                const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                const shiftIndex = diffDays >= 0 ? diffDays % shifts.length : (shifts.length + (diffDays % shifts.length)) % shifts.length;
                const currentShift = shifts[shiftIndex];
                
                const isToday = date.toDateString() === new Date().toDateString();
                
                dayElement.className = `h-20 rounded p-2 flex flex-col transition-all hover:shadow-md ${isToday ? 'ring-2 ring-blue-400' : ''}`;
                dayElement.style.backgroundColor = currentShift.color + '20';
                
                dayElement.innerHTML = `
                    <div class="flex justify-between items-start">
                        <span class="text-sm font-medium ${isToday ? 'text-blue-600' : 'text-gray-700'}">${day}</span>
                        <div class="w-3 h-3 rounded-full" style="background-color: ${currentShift.color}"></div>
                    </div>
                    <div class="mt-auto text-xs font-medium" style="color: ${currentShift.color}">
                        ${diffDays >= 0 ? currentShift.name : ''}
                    </div>
                `;
                
                grid.appendChild(dayElement);
            }
        }

        function prevMonth() {
            currentDate.setMonth(currentDate.getMonth() - 1);
            generateCalendar();
        }

        function nextMonth() {
            currentDate.setMonth(currentDate.getMonth() + 1);
            generateCalendar();
        }
    </script>
</body>
</html>
